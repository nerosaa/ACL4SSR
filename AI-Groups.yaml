# Profile Enhancement Groups Template for Clash Verge
# AI 智能分流：按国家优先级 + expected-status 纯净认证
prepend:
  - name: "🤖 OpenAI"
    type: select
    proxies:
      - "♻️ OpenAI·自动"
      - "♻️ 自动选择"
      - "🚀 节点选择"
      - DIRECT
  - name: "♻️ OpenAI·自动"
    type: fallback
    proxies:
      - "OpenAI·日"
      - "OpenAI·新"
      - "OpenAI·美"
      - "♻️ 自动选择"
  - name: "OpenAI·日"
    type: fallback
    include-all: true
    filter: "(日本|东京|大阪|川日|泉日|埼玉|沪日|深日|JP|Japan|Tokyo|Osaka|NRT|KIX|TYO)"
    exclude-filter: "(港|HK|hk|HKG|Hong)"
    url: "https://chatgpt.com/cdn-cgi/trace"
    expected-status: 200
    interval: 900
    timeout: 5000
    lazy: false
    max-failed-times: 3

