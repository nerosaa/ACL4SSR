;================================================================================
; AI 策略组（重写区）
;--------------------------------------------------------------------------------
; 结构：  服务入口(select) → 服务自动(fallback) → 按国家优先级排列的节点
;         fallback 的语义 = 「按顺序取第一个健康节点，只有它挂了才往下走」，
;         所以「国家优先级」直接由节点过滤器的先后顺序决定，这就是「智能选国家」。
;         同时 fallback 天然不会被负载均衡带着乱换 IP。
;--------------------------------------------------------------------------------
; 国家优先级依据各服务实际支持情况：
;   OpenAI ：日 > 新 > 美 > 台 > 韩 > 英  （香港不支持）
;   Claude ：美 > 日 > 新 > 台 > 英  （香港、中国大陆不支持）
;   Gemini ：美 > 日 > 新 > 台 > 韩  （香港不支持）
;================================================================================

;================================================================================
; v3 变更（针对「慢」和「额度」）
;--------------------------------------------------------------------------------
; 1) 地区组 load-balance -> url-test
;    load-balance 是 consistent-hashing，按域名哈希分节点，不看速度，
;    所以你经常被哈希到一个慢节点上死慢。改成 url-test = 永远用当前最快的。
; 2) 健康检查间隔 300 -> 1800 秒
;    每次健康检查都是一次真实的 Worker 请求，直接扣 Workers/Pages 额度。
;    254 个地区节点 / 300s = 每天 7.3 万次检查，免费额度 10 万直接被吃掉 73%。
;    改成 1800s 后约 1.2 万次/天（12%），剩下额度留给真实流量。
; 3) 删除死组 📶 官方优选（编辑: 你的订阅里它只有一个 DIRECT，纯占位）
;--------------------------------------------------------------------------------
; 节点挂了怎么办？mihomo 默认 max-failed-times=5，真实连接连续失败 5 次会强制
; 重新探活，所以间隔拉长不会导致「死了还一直用它」，只是慢一点发现。
; 想再省，把 1800 改成 3600；interval=0 则完全关闭周期体检（最省，但选速失准）。
;================================================================================
;================================================================================
; AI 策略组（v3：按国家可选）
;--------------------------------------------------------------------------------
; 结构：  🤖 OpenAI (select)  ← 你在这里点选国家
;            ├─ ♻️ OpenAI·自动    fallback，按国家优先级自动兜底
;            ├─ 🇯🇵 OpenAI·日      url-test，只在日本节点里挑
;            ├─ 🇸🇬 OpenAI·新
;            ├─ 🇺🇸 OpenAI·美
;            ├─ 🇰🇷 OpenAI·韩
;            └─ 🇹🇼 OpenAI·台
;--------------------------------------------------------------------------------
; 三个服务各自独立，可以给 ChatGPT 选日本、给 Claude 选美国、给 Gemini 选美国。
; 国家子组用 url-test + tolerance=200：延迟低者优先，但新节点要比当前节点
; 快 200ms 以上才切换，所以不会每次请求都换 IP（这点对 AI 登录态很关键）。
; 想要真·轮询分摊，把该组的 url-test 改成 load-balance 即可，代价是出口 IP 会变。
;--------------------------------------------------------------------------------
; 每个国家过滤器都带 (?!.*(港|HK|HKG|Hong)) 负向断言：
; 因为你有些节点名字写着「台湾 TW | HKG」，实际出口在香港，
; 这类节点进 AI 组照样会被三家全封，所以必须按名字排除掉。
; 香港整体不在任何 AI 组里：OpenAI / Gemini / Claude 三家都不支持香港。
;================================================================================
custom_proxy_group=🤖 OpenAI`select`[]♻️ OpenAI·自动`[]🇯🇵 OpenAI·日`[]🇸🇬 OpenAI·新`[]🇺🇸 OpenAI·美`[]🇰🇷 OpenAI·韩`[]🇹🇼 OpenAI·台`[]♻️ 自动选择`[]🚀 节点选择`[]DIRECT
