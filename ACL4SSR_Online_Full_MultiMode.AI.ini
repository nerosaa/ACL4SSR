;================================================================================
; 使用说明与局限
;--------------------------------------------------------------------------------
; 1) 本文件解决的是「AI 出口不稳定」：AI 流量不再经过 load-balance 轮询，
;    改为 fallback 粘滞，并按国家优先级取节点，且剔除了香港。
;
; 2) ini 表达不了的唯一一件事：
;    subconverter 只能生成 type/url/interval/timeout/tolerance 五个字段，
;    无法生成 mihomo 的 expected-status。
;    mihomo 的健康检查默认是「只要 HTTP 有响应就算健康」（等价 expected-status: *），
;    所以「403 = 地区封锁 / IP 被风控」这类节点，在本文件里仍会被判为「健康」。
;    本文件通过更换探测地址（chatgpt.com / claude.ai / gemini.google.com）
;    已经能判死「完全连不上」的节点（这是最常见的那一类），
;    但「能连上、只是被地区/风控 403」的那一类，需要 expected-status 才能判死。
;
; 3) 想要真正意义上的「AI 纯净认证」自动识别，把下面这段追加到 mihomo 原生配置
;    （例如 Clash Verge 的 Merge 覆写）里即可，ini 不用动：
;
;    proxy-groups:
;      - name: "♻️ OpenAI 自动"
;        type: fallback
;        include-all: true
;        filter: "(?i)(日本|JP|东京|大阪|NRT|KIX|新加坡|SG|Singapore|美|US|洛杉矶|圣何塞|西雅图|硅谷|台湾|TW|TPE|韩国|KR|ICN)"
;        exclude-filter: "(?i)(港|HK|Hong)"
;        url: "https://chatgpt.com/cdn-cgi/trace"
;        expected-status: 200
;        interval: 300
;        timeout: 6000
;        lazy: false
;        max-failed-times: 3
;
;    区别就在 expected-status: 200 —— 只有真的 200 才算健康，403 会被判死并自动换下一个。
;    Claude 用 url: "https://claude.ai/"、Gemini 用 url: "https://gemini.google.com/"，
;    三者一起用，就是「必须同时通过三家认证」的节点才会被选中。
;================================================================================

;luck
