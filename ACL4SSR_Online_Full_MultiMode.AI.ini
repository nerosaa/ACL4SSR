;acl4SSR规则
;================================================================================
; 版本：ACL4SSR_Online_Full_MultiMode.AI （在官方 MultiMode 基础上做 AI 专向优化）
;
; 本次改动只针对「AI 分流」，其余分流逻辑保持原样，风险最小。
; 核心修复 4 个问题：
;   1. 原版 AI 全部塞进一个 🤖 OpenAi 组，且该组首选 🚀 节点选择 → ♻️ 自动选择，
;      下面每层都是 load-balance(round-robin) —— 每次请求都换出口 IP，
;      ChatGPT/Claude/Gemini 的风控会把这种行为判为「账号异常」，且会话中途掉线。
;      修复：AI 单独走 fallback 组（粘滞，只有当前节点健康检查失败才换）。
;   2. 原版测速地址是 gstatic/generate_204，它只测「通不通」，
;      完全不测「这个 IP 能不能过 AI 的风控/地区限制」。
;      修复：每个 AI 服务用自己的真实入口做健康检查。
;   3. 原版把香港节点也放进 AI 组。香港被 OpenAI / Gemini / Claude 全部屏蔽。
;      修复：AI 组内只保留 日本/新加坡/美国/台湾/韩国/英国，不含香港。
;   4. 原版没有「按服务区分国家」的概念。同一节点往往 ChatGPT 能连、Claude 连不上
;      （实测很常见）。修复：OpenAI / Claude / Gemini 各自独立成组，各自的国家偏好不同。
;
; 注意：本 ini 由 subconverter 解析，它能生成的字段只有 type/url/interval/timeout/tolerance。
;       所以「只有当 IP 真的干净才判健康」这件事，需要 mihomo 的 expected-status 才能做到，
;       纯 ini 表达不了（详见文件末尾说明）。本文件已在不支持的范围内做到最接近。
;================================================================================

;去广告：支持
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持
;增强国外GFW：支持

